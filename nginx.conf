server {
    listen 3000;
    server_name _;
    root /home/ubuntu/new-nanthus-kitchen-temp/dist;
    index index.html;

    client_max_body_size 10m;

    # ── Compression ───────────────────────────────────────────────────────────
    # Serve pre-compressed brotli files produced by vite-plugin-compression2
    # Requires the ngx_brotli module (apt install libnginx-mod-brotli on Ubuntu)
    # brotli_static on;

    # Serve pre-compressed gzip files produced by vite-plugin-compression2
    gzip_static on;

    # Runtime gzip for anything not pre-compressed (API proxied responses, etc.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ── Security headers (applied globally) ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Hashed assets — immutable forever ────────────────────────────────────
    # Vite outputs all JS/CSS/images with content hashes into /assets/
    # Safe to cache for a year with immutable directive
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Fonts ─────────────────────────────────────────────────────────────────
    # Optimized public images generated from source media.
    location ^~ /optimized/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Public images (non-hashed, copied from /public/) ─────────────────────
    # These are served from the dist root (logo, banner, favicon, etc.)
    # Not content-hashed so use a short TTL with stale-while-revalidate
    location ~* \.(png|jpg|jpeg|webp|svg|ico|gif)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Uploaded media from backend ───────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploaded images change rarely but can be replaced — 7 day cache
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy (socket.io /public namespace) ─────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeout to keep WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── index.html — never cache ──────────────────────────────────────────────
    # This is the SPA shell. Browsers must always fetch a fresh copy so they
    # pick up new asset hashes after a deployment.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA catch-all ────────────────────────────────────────────────────────
    # All client-side routes fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain always;
    }
}
