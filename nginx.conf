server {
    listen 3000;
    server_name _;
    root /home/ubuntu/new-nanthus-kitchen-temp/dist;
    index index.html;

    client_max_body_size 10m;

    # ── Compression ───────────────────────────────────────────────────────────
    # Serve pre-compressed brotli files produced by vite-plugin-compression2
    # Requires the ngx_brotli module (apt install libnginx-mod-brotli on Ubuntu)
    # brotli_static on;

    # Serve pre-compressed gzip files produced by vite-plugin-compression2
    gzip_static on;

    # Runtime gzip for anything not pre-compressed (API proxied responses, etc.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/ld+json
        image/svg+xml font/woff font/woff2;

    # ── Security header macro ─────────────────────────────────────────────────
    # IMPORTANT: nginx does NOT inherit add_header directives from a parent
    # context into a child location block that has its own add_header directives.
    # Each location block that sets any add_header MUST also repeat all security
    # headers, otherwise they are silently dropped for those URLs.
    #
    # To avoid this repetition in the future, install ngx_headers_more and use
    # more_set_headers — it works independently of add_header inheritance rules.

    # ── Hashed assets — immutable forever ────────────────────────────────────
    # Vite outputs all JS/CSS/images with content hashes into /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control    "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # ── Optimized images ──────────────────────────────────────────────────────
    location ^~ /optimized/ {
        expires 7d;
        add_header Cache-Control    "public, max-age=604800, stale-while-revalidate=2592000" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # ── Web fonts ─────────────────────────────────────────────────────────────
    location ~* \.(woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control    "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options   "nosniff" always;
        access_log off;
    }

    # ── Public images (non-hashed, copied from /public/) ─────────────────────
    location ~* \.(png|jpg|jpeg|webp|svg|ico|gif)$ {
        expires 1d;
        add_header Cache-Control    "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ── Uploaded media from backend ───────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control    "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        access_log off;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket proxy (socket.io) ───────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── index.html — never cache ──────────────────────────────────────────────
    # Covers both the SPA root (dist/index.html) and the prerendered sub-page
    # files (dist/menu/index.html, dist/catering/index.html, etc.)
    location ~ /index\.html$ {
        add_header Cache-Control    "no-store" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag             "index, follow" always;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain always;
    }

    # ── SPA catch-all + prerendered page fallback ─────────────────────────────
    # nginx tries these in order for any unmatched URL:
    #   1. $uri           — exact file (e.g. dist/robots.txt)
    #   2. $uri/          — directory index (e.g. dist/menu/index.html ← prerendered pages!)
    #   3. /index.html    — SPA shell fallback for routes without a prerendered file
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control    "no-store" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    }
}
